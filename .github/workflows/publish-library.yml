name: Publish Blender asset library

# Trigger 3 of 4: the authoritative publish. Runs on the GitHub side, so the
# shared library updates even when the machine that made the commit is offline.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   secret  GDRIVE_SERVICE_ACCOUNT   the service-account JSON, pasted whole
#   secret  GDRIVE_TEAM_DRIVE_ID     the Shared Drive id (from its URL)
#   secret  GDRIVE_TARGET_PATH       folder inside the Shared Drive, e.g. ST3E_Ext
#
# Service accounts work cleanly against a Google *Shared* Drive (unlike My
# Drive): share the Shared Drive with the service account's email as Content
# manager and nothing else is needed - no OAuth flow, no token to refresh.
#
# The rclone remote is defined purely through RCLONE_CONFIG_* environment
# variables, so no rclone.conf ever has to exist in CI.

on:
  push:
    branches: [main]
    paths:
      - 'Blender/Geonodes/**'
      - 'Blender/Shading/**'
      - 'Blender/blender_assets.cats.txt'
      - 'Blender/Addons/ClaudeVibe_WIPs/*/distribution/*.zip'
      - 'Blender/Addons/ClaudeVibe_WIPs/LibraryPublisher/**'
      - '.github/workflows/publish-library.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, write nothing to the Shared Drive'
        type: boolean
        default: false
      force:
        description: 'Publish even if no file changed'
        type: boolean
        default: false
      run_criteria:
        description: 'Install Blender and run the criteria checks'
        type: boolean
        default: false

concurrency:
  # Never let two publishes race for the same Drive folder.
  group: publish-library
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TOOL: Blender/Addons/ClaudeVibe_WIPs/LibraryPublisher
      # rclone remote 'gdrive', configured entirely from the environment.
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_TEAM_DRIVE: ${{ secrets.GDRIVE_TEAM_DRIVE_ID }}
      RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/.sa.json
      ST3E_GDRIVE_SA_JSON: ${{ github.workspace }}/.sa.json

    steps:
      - uses: actions/checkout@v4
        with:
          # The library .blend files live in git, so a normal checkout is all
          # the publisher needs - no LFS, no artifact download.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Publishing from CI is OPTIONAL - the local pre-push hook and
      # /publish-library are the primary paths. If the credentials were never
      # set up, say so once and stop cleanly. A red X on every push for a
      # feature nobody enabled is noise, not a signal.
      - name: Check whether CI publishing is configured
        id: creds
        env:
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI publishing not configured::Set the GDRIVE_SERVICE_ACCOUNT, GDRIVE_TEAM_DRIVE_ID and GDRIVE_TARGET_PATH repository secrets to publish from CI. Skipping."
            {
              echo '## Library publish - skipped'
              echo ''
              echo 'CI publishing is not configured, so this run did nothing.'
              echo ''
              echo 'To enable it, add these repository secrets'
              echo '(Settings > Secrets and variables > Actions):'
              echo ''
              echo '| secret | value |'
              echo '|---|---|'
              echo '| `GDRIVE_SERVICE_ACCOUNT` | the service-account JSON key, pasted whole |'
              echo '| `GDRIVE_TEAM_DRIVE_ID` | the Shared Drive id from its URL |'
              echo '| `GDRIVE_TARGET_PATH` | folder inside the Shared Drive, e.g. `3D/Tooling/Blender/ST3E_Ext` |'
              echo ''
              echo 'Share the Shared Drive with the service account email as Content manager.'
              echo 'Until then, publish locally with `/publish-library`.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install rclone
        if: steps.creds.outputs.configured == 'true'
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write service-account credentials
        if: steps.creds.outputs.configured == 'true'
        env:
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$ST3E_GDRIVE_SA_JSON"
          # A secret that IS set but is not valid JSON is a genuine failure, and
          # deserves a readable message rather than a decoder traceback.
          if ! python -c "import json,os,sys; json.load(open(os.environ['ST3E_GDRIVE_SA_JSON']))" 2>/dev/null; then
            echo "::error title=Bad service-account secret::GDRIVE_SERVICE_ACCOUNT is set but is not valid JSON. Paste the whole key file, including the outer braces."
            exit 1
          fi
          echo "service account JSON parses"

      - name: Install Blender (only when criteria are requested)
        if: steps.creds.outputs.configured == 'true' && inputs.run_criteria
        run: |
          sudo snap install blender --classic
          blender --version

      - name: Point the config at this runner
        if: steps.creds.outputs.configured == 'true'
        run: |
          python "$TOOL/source/cli.py" config set \
            "source.repo_root=$GITHUB_WORKSPACE" \
            "delivery.backend=rclone" \
            "delivery.rclone.remote=gdrive" \
            "delivery.rclone.path=${{ secrets.GDRIVE_TARGET_PATH }}" \
            "delivery.rclone.team_drive=${{ secrets.GDRIVE_TEAM_DRIVE_ID }}" \
            "delivery.atomic=false"

      - name: Switch criteria off unless requested
        if: steps.creds.outputs.configured == 'true' && !inputs.run_criteria
        run: |
          # Without Blender on the runner a block-mode check cannot be verified,
          # and the publisher refuses to pretend otherwise - so turn them off
          # explicitly. The local pre-push hook is where checks normally run.
          python "$TOOL/source/cli.py" config set \
            criteria.geonode_layout.mode=off \
            criteria.asset_marked.mode=off \
            criteria.catalog_assigned.mode=off \
            criteria.no_external_deps.mode=off

      - name: Environment check
        if: steps.creds.outputs.configured == 'true'
        run: python "$TOOL/source/cli.py" config doctor

      - name: Unit tests
        if: steps.creds.outputs.configured == 'true'
        run: python -m pytest "$TOOL/source/tests" -q

      - name: Publish
        if: steps.creds.outputs.configured == 'true'
        run: |
          # Without pipefail the exit status is tee's, so a failed publish - or a
          # non-zero "files were withheld" - would report success.
          set -o pipefail
          # --dry-run is a global flag (before the subcommand), --force is not.
          GLOBAL=""
          SUB="--reason github-action"
          if [ "${{ inputs.dry_run }}" = "true" ]; then GLOBAL="--dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then SUB="$SUB --force"; fi
          python "$TOOL/source/cli.py" $GLOBAL publish $SUB 2>&1 | tee publish.log

      - name: Summarise
        if: always() && steps.creds.outputs.configured == 'true'
        run: |
          {
            echo '## Library publish'
            echo '```'
            tail -n 60 publish.log 2>/dev/null || echo 'no log produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the manifest
        if: always() && steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish-manifest
          path: |
            ${{ env.TOOL }}/.last_publish/publish_manifest.json
            publish.log
          if-no-files-found: warn

      - name: Shred credentials
        if: always() && steps.creds.outputs.configured == 'true'
        run: rm -f "$ST3E_GDRIVE_SA_JSON"
